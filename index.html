<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Laker</title>
		<meta name="description" content="Laker - nothing to see here" />
		<style>
			:root {
				--bg1: #f6f7fb;
				--bg2: #ffffff;
				--text: #0b1220;
				--muted: #5b646f;
				--accent: #1b6cff;
			}

			* { box-sizing: border-box; }
			html, body { height: 100%; }
			body {
				margin: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: linear-gradient(180deg, var(--bg1), var(--bg2));
				color: var(--text);
				font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}

			main {
				text-align: center;
				padding: 3rem 1.5rem;
				width: min(860px, 94%);
			}

			h1 {
				margin: 0;
				font-weight: 700;
				font-size: min(12vw, 120px);
				line-height: 0.9;
				letter-spacing: 0.02em;
			}

			.small {
				margin-top: 1rem;
				color: var(--muted);
				font-size: 0.95rem;
			}

			@media (prefers-reduced-motion: no-preference) {
				h1 { animation: fadeIn 1s ease both; transform-origin: center; }
				.small { animation: fadeIn 5s ease both; }
			}

			@keyframes fadeIn {
				from { opacity: 0; transform: translateY(50px) scale(.995); }
				to { opacity: 1; transform: none; }
			}
		</style>
	</head>
	<body>
		<main>
			<p id="greeting" class="small" aria-live="polite">Good day.</p>
		</main>
		<script>
			(function () {
				function greetingForHour(h) {
					if (h < 12) return 'Good morning.';
					if (h < 18) return 'Good afternoon.';
					return 'Good evening.';
				}
				var el = document.getElementById('greeting');
				if (el) {
					try { el.textContent = greetingForHour(new Date().getHours()); } catch (e) { /* noop */ }
				}
			})();
		</script>
	</body>
</html>
